openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Student Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Student management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [IN, OUT]
        - name: remarks
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Register a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateStudent
      tags: [students]
      summary: Update a student record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /students/stats/summary:
    get:
      operationId: getStudentSummary
      tags: [students]
      summary: Get attendance summary statistics
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Student:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        yearLevel:
          type: string
        block:
          type: string
        course:
          type: string
        room:
          type: string
        time:
          type: string
        status:
          type: string
          enum: [IN, OUT, "N/A"]
        remarks:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - block
        - course
        - room
        - time
        - status
        - remarks
        - createdAt
    CreateStudentRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        yearLevel:
          type: string
        block:
          type: string
        course:
          type: string
        room:
          type: string
        status:
          type: string
          enum: [IN, OUT, "N/A"]
        remarks:
          type: string
      required:
        - name
    UpdateStudentRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        yearLevel:
          type: string
        block:
          type: string
        course:
          type: string
        room:
          type: string
        status:
          type: string
          enum: [IN, OUT, "N/A"]
        remarks:
          type: string
    StudentSummary:
      type: object
      properties:
        total:
          type: integer
        present:
          type: integer
        absent:
          type: integer
        late:
          type: integer
      required:
        - total
        - present
        - absent
        - late
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
